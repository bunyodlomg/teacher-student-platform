# Cambridge Learn — Nginx reverse proxy
# Joylashuv (VPS): /etc/nginx/sites-available/cambridge-learn
# Yoqish: sudo ln -s /etc/nginx/sites-available/cambridge-learn /etc/nginx/sites-enabled/
#
# Subdomain: learn.cambridgeschool.uz (asosiy domenga tegilmaydi).

# --- Socket.IO uchun WebSocket "Upgrade" xaritasi ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name learn.cambridgeschool.uz;

    # Fayl yuklash limiti (loyihada 100 MB)
    client_max_body_size 100M;

    # Next.js statik fayllari uchun keshni proxy hal qiladi
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket / Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Original so'rov ma'lumotlari
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uzoq WebSocket ulanishlari uzilib qolmasligi uchun
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_cache_bypass $http_upgrade;
    }
}
